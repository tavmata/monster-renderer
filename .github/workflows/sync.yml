name: Sync to 2MMORPG Game

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/**'
  workflow_dispatch:

jobs:
  sync:
    name: Sync Monster Renderer into 2MMORPG Game
    runs-on: ubuntu-latest
    steps:
      - name: Checkout monster-renderer
        uses: actions/checkout@v4
        with:
          path: monster-renderer

      - name: Checkout 2mmorpgexport
        uses: actions/checkout@v4
        with:
          repository: tavmata/2mmorpgexport
          token: ${{ secrets.SYNC_TOKEN }}
          path: 2mmorpgexport
          ref: master

      - name: Sync Renderer Files
        run: |
          mkdir -p 2mmorpgexport/client/js/monster-renderer
          rsync -av --delete \
            --exclude='.git*' \
            --exclude='.github' \
            monster-renderer/ 2mmorpgexport/client/js/monster-renderer/

      - name: Commit and Push to 2mmorpgexport
        run: |
          cd 2mmorpgexport
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add client/js/monster-renderer
          if git diff --staged --quiet; then
            echo "No changes to sync. Repository is already up to date."
          else
            COMMIT_MSG="chore: sync monster-renderer (${{ github.sha }})"
            git commit -m "$COMMIT_MSG"
            git push origin master
            echo "Successfully synced changes to tavmata/2mmorpgexport!"
          fi
