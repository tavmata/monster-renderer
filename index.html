<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2D Procedural Monster Renderer Studio</title>
  <meta name="description" content="Interactive visual testing studio for 2MMORPG procedural lineless monsters, mobs, bosses, and creatures.">
  <meta property="og:title" content="2D Procedural Monster Renderer Studio">
  <meta property="og:description" content="Interactive visual testing studio for 2MMORPG procedural lineless monsters, mobs, bosses, and creatures.">
  <style>
    :root {
      --bg-primary: #0b1120;
      --bg-surface: #131d31;
      --bg-card: #1e293b;
      --border-color: #334155;
      --border-focus: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-cyan: #38bdf8;
      --accent-emerald: #10b981;
      --accent-amber: #f59e0b;
      --accent-rose: #f43f5e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 16px 28px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-badge {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent-cyan);
      padding: 4px 10px;
      border-radius: 9999px;
      border: 1px solid rgba(56, 189, 248, 0.35);
    }

    h1 {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.4px;
    }

    .subtitle {
      font-size: 13px;
      color: var(--text-muted);
    }

    .main-layout {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 20px;
      padding: 24px;
      flex: 1;
      max-width: 1440px;
      width: 100%;
      margin: 0 auto;
    }

    @media (max-width: 960px) {
      .main-layout {
        grid-template-columns: 1fr;
      }
    }

    .viewport-container {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .canvas-wrap {
      position: relative;
      background: radial-gradient(circle at center, #1a2538 0%, #0d1524 100%);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.5), 0 8px 30px rgba(0, 0, 0, 0.4);
      height: 600px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      image-rendering: pixelated;
    }

    .hud-overlay {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(11, 17, 32, 0.85);
      backdrop-filter: blur(8px);
      padding: 8px 14px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      font-family: monospace;
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      gap: 14px;
    }

    .sidebar {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      overflow-y: auto;
      max-height: calc(100vh - 120px);
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .control-group label {
      font-size: 12px;
      font-weight: 700;
      color: var(--accent-cyan);
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    select, input[type="range"], input[type="text"] {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }

    select:focus, input:focus {
      border-color: var(--border-focus);
    }

    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    button {
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 9px 14px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    button:hover {
      background: #0369a1;
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-secondary {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
    }

    .btn-secondary:hover {
      background: #334155;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      color: var(--text-muted);
      cursor: pointer;
    }

    .toggle-row input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--accent-cyan);
      cursor: pointer;
    }

    .slider-val {
      font-size: 11px;
      color: var(--text-muted);
      float: right;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span class="brand-badge">Procedural Engine</span>
      <div>
        <h1>Monster Renderer Studio</h1>
        <p class="subtitle">Interactive lineless monster kinematics & volumetric asset preview</p>
      </div>
    </div>
    <div>
      <span style="font-size: 12px; color: var(--text-muted);">@2mmorpg/monster-renderer v1.0.0</span>
    </div>
  </header>

  <div class="main-layout">
    <div class="viewport-container">
      <div class="canvas-wrap">
        <canvas id="viewCanvas" width="800" height="600"></canvas>
        <div class="hud-overlay">
          <span>FPS: <strong id="fpsVal" style="color:#10b981;">60</strong></span>
          <span>Entity: <strong id="hudEntType" style="color:#38bdf8;">Slime</strong></span>
          <span>Angle: <strong id="hudAngle">0 deg</strong></span>
        </div>
      </div>
    </div>

    <div class="sidebar">
      <!-- Monster Category -->
      <div class="control-group">
        <label for="mobType">Monster Family</label>
        <select id="mobType" onchange="onMonsterFamilyChange(this.value)">
          <option value="spider">Giant Cave Spider (Multi-Leg Stepping)</option>
          <option value="skeleton">Skeleton (Samba Carnaval)</option>
          <option value="slime">Organic Slime (Soft-Body Wobble)</option>
          <option value="wolf">Wolf / Canine (Digitigrade Quadruped)</option>
          <option value="frost_troll" selected>Frost Troll (8-Dir Octagonal Kinematics)</option>
          <option value="goblin">Goblin Infantry (8-Dir Armed Stance)</option>
          <option value="boss_void">Void Terror (Eldritch Cosmic Singularity)</option>
        </select>
      </div>

      <!-- Variant -->
      <div class="control-group">
        <label for="mobVariant">Variant & Tier</label>
        <select id="mobVariant" onchange="onVariantChange(this.value)">
          <!-- Populated dynamically -->
        </select>
      </div>

      <!-- Facing Angle -->
      <div class="control-group">
        <label for="angleSlider">Facing Direction <span class="slider-val" id="angleDeg">0 deg</span></label>
        <input type="range" id="angleSlider" min="0" max="6.283" step="0.05" value="0" oninput="onAngleInput(this.value)">
      </div>

      <!-- Scale / Zoom -->
      <div class="control-group">
        <label for="scaleSlider">Preview Zoom <span class="slider-val" id="scaleVal">2.0x</span></label>
        <input type="range" id="scaleSlider" min="1.0" max="4.0" step="0.25" value="2.0" oninput="onScaleInput(this.value)">
      </div>

      <!-- Health Bar -->
      <div class="control-group">
        <label for="hpSlider">Entity Health <span class="slider-val" id="hpPercent">100%</span></label>
        <input type="range" id="hpSlider" min="0" max="100" value="100" oninput="onHpInput(this.value)">
      </div>

      <!-- Life Bar Height -->
      <div class="control-group">
        <label for="hpOffsetSlider">Life Bar Height <span class="slider-val" id="hpOffsetVal">Auto (64px)</span></label>
        <input type="range" id="hpOffsetSlider" min="0" max="130" step="2" value="0" oninput="onHpOffsetInput(this.value)">
      </div>

      <!-- Samba Rhythm BPM (Batucada Tempo) -->
      <div class="control-group" id="sambaBpmGroup">
        <label for="sambaBpmSlider">Samba Batucada Tempo <span class="slider-val" id="bpmVal">124 BPM</span></label>
        <input type="range" id="sambaBpmSlider" min="90" max="160" step="2" value="124" oninput="onBpmInput(this.value)">
      </div>

      <!-- Actions & Toggles -->
      <div class="control-group">
        <label>Actions & States</label>
        <div class="btn-row">
          <button onclick="triggerAttack()">Attack</button>
          <button class="btn-secondary" onclick="triggerHitFlash()">Hit Flash</button>
        </div>
        <div class="btn-row" id="archerBtnRow" style="margin-top: 6px;">
          <button style="background: #166534;" onclick="triggerShootArrow()">Shoot Arrow</button>
          <button class="btn-secondary" style="border-color: #22c55e; color: #4ade80;" onclick="triggerArrowVolley()">Triple Volley</button>
        </div>
        <div class="btn-row" id="trollBtnRow" style="margin-top: 6px; display: none;">
          <button style="background: #0284c7;" onclick="triggerGlacialSlam()">Glacial Slam</button>
          <button class="btn-secondary" style="border-color: #38bdf8; color: #38bdf8;" onclick="triggerBlizzardRoar()">Blizzard Roar</button>
        </div>
        <div class="btn-row" style="margin-top: 6px;">
          <button class="btn-secondary" style="border-color: #a855f7; color: #c084fc;" onclick="triggerVoidCataclysm()">Void Nova</button>
          <button class="btn-secondary" style="border-color: var(--accent-rose); color: var(--accent-rose);" onclick="triggerLimbExplosion()">Death Explosion</button>
        </div>
        <div class="btn-row" style="margin-top: 6px;">
          <button class="btn-secondary" style="border-color: var(--accent-amber); color: var(--accent-amber); grid-column: span 2;" onclick="triggerConfettiFiesta()">Confetti Fiesta</button>
        </div>
      </div>

      <div class="control-group">
        <label>Kinematic Flags</label>
        <label class="toggle-row" id="glassToggleRow">
          <span>Glass Visual Effect (Vitreous Ice)</span>
          <input type="checkbox" id="chkGlass" checked>
        </label>
        <label class="toggle-row">
          <span>Walking Gait / Moving</span>
          <input type="checkbox" id="chkMoving" checked>
        </label>
        <label class="toggle-row">
          <span>Slowed Effect (Frost Chill)</span>
          <input type="checkbox" id="chkSlowed">
        </label>
        <label class="toggle-row" id="autoFireToggleRow">
          <span>Auto-Fire Rapid Volley</span>
          <input type="checkbox" id="chkAutoFire">
        </label>
        <label class="toggle-row">
          <span>Slime Trail Puddles</span>
          <input type="checkbox" id="chkPuddles" checked>
        </label>
        <label class="toggle-row">
          <span>Slime Landing Ripples</span>
          <input type="checkbox" id="chkRipples" checked>
        </label>
        <label class="toggle-row">
          <span>Draw Health Nameplate</span>
          <input type="checkbox" id="chkHpBar" checked>
        </label>
      </div>

      <!-- Glass Refraction & Sheen Slider -->
      <div class="control-group" id="glassControlGroup">
        <label for="glassSlider">Glass Refraction & Sheen <span class="slider-val" id="glassVal">85%</span></label>
        <input type="range" id="glassSlider" min="10" max="100" value="85" oninput="onGlassInput(this.value)">
      </div>

      <!-- Slime Hop Height -->
      <div class="control-group">
        <label for="hopSlider">Slime Hop Height <span class="slider-val" id="hopVal">1.0x</span></label>
        <input type="range" id="hopSlider" min="0.4" max="1.8" step="0.1" value="1.0" oninput="onHopInput(this.value)">
      </div>
    </div>
  </div>

  <script type="module">
    import {
      drawMonster,
      drawSpiderEntity,
      drawSlimeEntity,
      drawWolfEntity,
      drawFrostTrollEntity,
      drawGoblinEntity,
      drawSkeletonEntity,
      drawGenericMob,
      drawEntityHP,
      getMobUiOffsets,
      triggerSpiderDeathExplosion,
      triggerWolfDeathLimbExplosion,
      triggerSkeletonDeathExplosion,
      triggerVoidDeathExplosion,
      triggerFrostTrollDeathExplosion,
      shootGoblinArrow,
      shootGoblinArrowVolley,
      updateGoblinArrows,
      drawGoblinArrows,
      clearGoblinArrows,
      goblinArrows
    } from './src/index.js';

    window.GameState = window.GameState || { combatAnimations: [], myId: "preview_mob" };
    window.shouldShowMobHpBar = () => document.getElementById('chkHpBar').checked;

    // Canvas particle system for limb explosions and VFX
    const particles = [];
    window.spawnParticle = (p) => {
      particles.push({
        x: p.x,
        y: p.y,
        vx: p.vx || 0,
        vy: p.vy || 0,
        color: Array.isArray(p.color) ? p.color[Math.floor(Math.random() * p.color.length)] : (p.color || '#fff'),
        size: p.size || 3,
        life: 0,
        maxLife: p.maxLife || 1.0,
        gravity: p.gravity || 0,
        drag: p.drag || 0.98,
        shrink: !!p.shrink,
        style: p.style || 'circle',
        accentColor: p.accentColor
      });
    };

    const VARIANTS = {
      spider: [
        { label: "Giant Cave Spider (Subterranean Obsidian Chitin)", val: "giant_cave_spider" },
        { label: "Venomous Broodmother (Bloated Egg Sac Boss)", val: "boss_broodmother" },
        { label: "Crystalline Cave Weaver (Amethyst Facets & Prisms)", val: "boss_crystal_weaver" },
        { label: "Armored Toxic Tarantula (Barbed Setae & Heavy Fangs)", val: "toxic_tarantula" },
        { label: "Void Shadow Stalker (Abyssal Chitin & Bioluminescence)", val: "void_stalker" }
      ],
      skeleton: [
        { label: "Samba Passista Skeleton (Carnaval Headdress & Pandeiro)", val: "skeleton" },
        { label: "Mestre de Bateria Skeleton (Conductor Batons & Tricolor Plumes)", val: "skeleton_mestre" },
        { label: "Samba Malandro Skeleton (Panama Hat & Cane Swagger)", val: "skeleton_malandro" },
        { label: "Guerreiro do Sambodromo (Golden Guard & Shield Pandeiro)", val: "elite_knight" },
        { label: "Rei Momo dos Ossos (Carnival Skeleton King Boss)", val: "boss_samba_king" }
      ],
      slime: [
        { label: "Forest Green Slime", val: "slime" },
        { label: "Toxic Acid Slime", val: "toxic_slime" },
        { label: "Magma Core Slime", val: "magma_slime" },
        { label: "Deep Frost Slime", val: "frost_slime" },
        { label: "Elite Golden Slime (Crown)", val: "elite_slime" }
      ],
      wolf: [
        { label: "Grey Forest Wolf", val: "wolf" },
        { label: "Dire Wolf (Spine Fur Mantle)", val: "dire_wolf" },
        { label: "Blood Fang Alpha Wolf", val: "alpha_wolf" },
        { label: "Frost White Wolf", val: "arctic_wolf" },
        { label: "The Wolf King (Boss)", val: "boss_wolf" },
        { label: "Corrupted Void Wolf", val: "corrupted_wolf" }
      ],
      frost_troll: [
        { label: "Vitreous Glass Frost Troll (Prismatic Crystal)", val: "glass_troll" },
        { label: "Jotunn Frost Giant (Colossal Glacial Titan)", val: "jotunn" },
        { label: "Jotunn Giant Chieftain (Glacial Horns & Blizzard Aura)", val: "boss_frost_giant" },
        { label: "Ancient Frost Troll (Permafrost Knuckles)", val: "frost_troll" },
        { label: "Glacial Berserker (Ice Spiked Pauldron & Frozen Maul)", val: "glacial_troll" },
        { label: "Crystalline Frost Colossus (Translucent Prisms & Runic Core)", val: "crystal_troll" }
      ],
      goblin: [
        { label: "Goblin Scout (Dagger)", val: "goblin" },
        { label: "Goblin Warrior (Wooden Shield)", val: "goblin_warrior" },
        { label: "Goblin Archer", val: "goblin_archer" },
        { label: "Goblin Chieftain", val: "boss_goblin" }
      ],
      boss_void: [
        { label: "Void Terror Leviathan (Event Horizon Singularity & 10 Tentacles)", val: "boss_void_terror" },
        { label: "Void Terror Brood (Abyssal Cosmic Horror)", val: "void_terror" },
        { label: "Astral Devourer (Barbed Scythe Tendrils & Razor Maw)", val: "void_devourer" },
        { label: "Eldritch Null-Gazer (All-Seeing Cosmic Eye & Psionic Rings)", val: "void_null_gazer" },
        { label: "Void Shadow Stalker (Abyssal Chitin & Bioluminescence)", val: "void_stalker" },
        { label: "Void Skitterer Spawn (Agile Abyssal Minion)", val: "void_spawn" }
      ]
    };

    const canvas = document.getElementById('viewCanvas');
    const ctx = canvas.getContext('2d');

    const state = {
      family: "frost_troll",
      type: "jotunn",
      angle: 0,
      scale: 2.0,
      hp: 100,
      maxHp: 100,
      sambaBpm: 124,
      customHpOffset: 0,
      isAttacking: false,
      isBreathingFrost: false,
      attackTime: 0,
      flashTime: 0,
      seed: 42
    };

    function updateHpOffsetLabel() {
      const autoVal = getMobUiOffsets({ type: state.type }).hpOffset;
      const lbl = document.getElementById('hpOffsetVal');
      if (lbl) {
        lbl.innerText = state.customHpOffset === 0 ? "Auto (" + autoVal + "px)" : state.customHpOffset + "px";
      }
    }

    function updateArcherControls() {
      const isArcher = state.type.includes('archer');
      const archerRow = document.getElementById('archerBtnRow');
      const autoFireRow = document.getElementById('autoFireToggleRow');
      if (archerRow) archerRow.style.display = isArcher ? "grid" : "none";
      if (autoFireRow) autoFireRow.style.display = isArcher ? "flex" : "none";

      const isTroll = state.family === "frost_troll" || state.type.includes("troll") || state.type.includes("jotunn") || state.type.includes("giant");
      const trollRow = document.getElementById('trollBtnRow');
      if (trollRow) trollRow.style.display = isTroll ? "grid" : "none";

      const glassGroup = document.getElementById('glassControlGroup');
      const glassToggle = document.getElementById('glassToggleRow');
      if (glassGroup) glassGroup.style.display = isTroll ? "flex" : "none";
      if (glassToggle) glassToggle.style.display = isTroll ? "flex" : "none";
    }

    window.onGlassInput = (val) => {
      const lbl = document.getElementById('glassVal');
      if (lbl) lbl.innerText = val + "%";
    };

    window.onMonsterFamilyChange = (fam) => {
      state.family = fam;
      updateVariantDropdown(fam);
      state.type = VARIANTS[fam][0].val;
      document.getElementById('hudEntType').innerText = VARIANTS[fam][0].label;
      const bpmGroup = document.getElementById('sambaBpmGroup');
      if (bpmGroup) {
        bpmGroup.style.display = (fam === "skeleton") ? "flex" : "none";
      }
      updateHpOffsetLabel();
      updateArcherControls();
    };

    window.onVariantChange = (v) => {
      state.type = v;
      const curList = VARIANTS[state.family] || [];
      const match = curList.find(item => item.val === v);
      document.getElementById('hudEntType').innerText = match ? match.label : v;
      updateHpOffsetLabel();
      updateArcherControls();
    };

    window.onAngleInput = (rad) => {
      state.angle = parseFloat(rad);
      const deg = Math.round(state.angle * (180 / Math.PI));
      document.getElementById('angleDeg').innerText = deg + " deg";
      document.getElementById('hudAngle').innerText = deg + " deg";
    };

    window.onScaleInput = (sc) => {
      state.scale = parseFloat(sc);
      document.getElementById('scaleVal').innerText = state.scale.toFixed(1) + "x";
    };

    window.onHpInput = (val) => {
      state.hp = parseInt(val, 10);
      document.getElementById('hpPercent').innerText = state.hp + "%";
    };

    window.onHpOffsetInput = (val) => {
      state.customHpOffset = parseInt(val, 10);
      updateHpOffsetLabel();
    };

    window.onBpmInput = (val) => {
      state.sambaBpm = parseInt(val, 10);
      document.getElementById('bpmVal').innerText = state.sambaBpm + " BPM";
    };

    window.onHopInput = (val) => {
      document.getElementById('hopVal').innerText = parseFloat(val).toFixed(1) + "x";
    };

    window.triggerAttack = () => {
      state.isAttacking = true;
      state.attackDuration = state.type.includes('archer') ? 450 : 500;
      state.attackTime = performance.now();
      state._lastArrowFiredCycle = null;
    };

    window.triggerShootArrow = () => {
      state.isAttacking = true;
      state.attackDuration = 450;
      state.attackTime = performance.now();
      state._lastArrowFiredCycle = null;
    };

    window.triggerArrowVolley = () => {
      state.isAttacking = true;
      state.attackDuration = 450;
      const now = performance.now();
      state.attackTime = now;
      state._lastArrowFiredCycle = now;
      const launchX = Math.cos(state.angle) * 16;
      const launchY = -9.5 + Math.sin(state.angle) * 16;
      shootGoblinArrowVolley({
        x: launchX,
        y: launchY,
        angle: state.angle,
        sourceId: "preview_mob",
        speed: 720
      });
    };

    window.triggerGlacialSlam = () => {
      state.isAttacking = true;
      state.attackDuration = 650;
      state.attackTime = performance.now();
      state.isBreathingFrost = false;
    };

    window.triggerBlizzardRoar = () => {
      state.isBreathingFrost = !state.isBreathingFrost;
      state.roarTime = performance.now();
    };

    window.triggerVoidCataclysm = () => {
      state.isAttacking = true;
      state.attackDuration = 1000;
      state.attackTime = performance.now();
    };

    window.triggerHitFlash = () => {
      state.flashTime = performance.now();
    };

    window.triggerLimbExplosion = () => {
      const dummyCe = {
        id: "preview_mob",
        type: state.type,
        hp: 0,
        maxHp: 100,
        x: 0,
        y: 0
      };
      if (
        state.family === "frost_troll" ||
        state.type.includes("troll") ||
        state.type.includes("giant")
      ) {
        triggerFrostTrollDeathExplosion(dummyCe);
      } else if (
        state.type === "void_stalker" ||
        state.type.includes("stalker") ||
        state.family === "spider" ||
        state.type.includes("spider") ||
        state.type.includes("weaver") ||
        state.type.includes("broodmother") ||
        state.type.includes("tarantula")
      ) {
        triggerSpiderDeathExplosion(dummyCe);
      } else if (
        state.family === "boss_void" ||
        state.type.includes("void") ||
        state.type.includes("terror") ||
        state.type.includes("devourer") ||
        state.type.includes("gazer")
      ) {
        triggerVoidDeathExplosion(dummyCe);
      } else if (state.family === "skeleton" || state.type.includes("skeleton") || state.type.includes("samba") || state.type.includes("knight") || state.type.includes("mestre") || state.type.includes("malandro")) {
        triggerSkeletonDeathExplosion(dummyCe);
      } else {
        triggerWolfDeathLimbExplosion(dummyCe);
      }
    };

    window.triggerConfettiFiesta = () => {
      const dummyCe = {
        id: "preview_mob",
        type: state.type,
        hp: 0,
        maxHp: 100,
        x: 0,
        y: 0
      };
      triggerSkeletonDeathExplosion(dummyCe);
    };

    function updateVariantDropdown(fam) {
      const sel = document.getElementById('mobVariant');
      sel.innerHTML = "";
      const list = VARIANTS[fam] || [];
      list.forEach(item => {
        const opt = document.createElement('option');
        opt.value = item.val;
        opt.innerText = item.label;
        sel.appendChild(opt);
      });
    }

    // Initialize dropdown with frost troll
    updateVariantDropdown("frost_troll");
    const variantSelect = document.getElementById('mobVariant');
    if (variantSelect) {
      variantSelect.value = "glass_troll";
    }
    state.type = "glass_troll";
    const trollVariant = VARIANTS.frost_troll[0];
    document.getElementById('hudEntType').innerText = trollVariant.label;
    const bpmGroup = document.getElementById('sambaBpmGroup');
    if (bpmGroup) {
      bpmGroup.style.display = "none";
    }
    updateHpOffsetLabel();
    updateArcherControls();

    // Canvas click-to-aim and attack
    canvas.addEventListener('pointerdown', (e) => {
      const rect = canvas.getBoundingClientRect();
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const mouseX = (e.clientX - rect.left - cx) / state.scale;
      const mouseY = (e.clientY - rect.top - cy) / state.scale;
      const angle = Math.atan2(mouseY, mouseX);

      state.angle = ((angle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
      const deg = Math.round(state.angle * (180 / Math.PI));
      const slider = document.getElementById('angleSlider');
      if (slider) slider.value = state.angle;
      document.getElementById('angleDeg').innerText = deg + " deg";
      document.getElementById('hudAngle').innerText = deg + " deg";

      if (state.type.includes('archer')) {
        window.triggerShootArrow();
      } else if (state.family === "frost_troll" || state.type.includes("troll") || state.type.includes("jotunn") || state.type.includes("giant")) {
        window.triggerGlacialSlam();
      } else {
        window.triggerAttack();
      }
    });

    // 60 FPS Render Loop
    let lastTime = performance.now();
    let frameCount = 0;
    let fpsTime = lastTime;

    function renderLoop(now) {
      const dt = Math.min(0.1, (now - lastTime) / 1000);
      lastTime = now;

      frameCount++;
      if (now - fpsTime >= 500) {
        const fps = Math.round((frameCount * 1000) / (now - fpsTime));
        document.getElementById('fpsVal').innerText = fps;
        frameCount = 0;
        fpsTime = now;
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const isMoving = document.getElementById('chkMoving').checked;
      const isSlowed = document.getElementById('chkSlowed').checked;
      const showHp = document.getElementById('chkHpBar').checked;
      const curAttackDur = state.attackDuration || 500;

      if (state.isAttacking && now - state.attackTime > curAttackDur) {
        state.isAttacking = false;
        state._lastArrowFiredCycle = null;
      }

      // Auto-fire rapid volley for archer
      if (state.type.includes('archer') && document.getElementById('chkAutoFire')?.checked) {
        if (!state._lastAutoFire || now - state._lastAutoFire > 1250) {
          state._lastAutoFire = now;
          window.triggerShootArrow();
        }
      }

      const ent = {
        id: "preview_mob",
        type: state.type,
        x: 0,
        y: 0,
        hp: state.hp,
        maxHp: state.maxHp,
        facingAngle: state.angle,
        moving: isMoving,
        isMoving: isMoving,
        isSlowed: isSlowed,
        isAttacking: state.isAttacking,
        isBreathingFrost: !!state.isBreathingFrost,
        lastHitTime: state.flashTime,
        attackStart: state.attackTime,
        lastAttackTime: state.attackTime,
        _lastArrowFiredCycle: state._lastArrowFiredCycle,
        sambaBpm: state.sambaBpm || 124,
        showPuddles: document.getElementById('chkPuddles') ? document.getElementById('chkPuddles').checked : true,
        showRipples: document.getElementById('chkRipples') ? document.getElementById('chkRipples').checked : true,
        hopIntensity: parseFloat(document.getElementById('hopSlider')?.value || "1.0"),
        glassEffect: document.getElementById('chkGlass') ? document.getElementById('chkGlass').checked : true,
        glassRefraction: parseFloat(document.getElementById('glassSlider')?.value || "85") / 100,
        currentCast: state.isAttacking ? {
          progress: Math.min(1, (now - state.attackTime) / curAttackDur),
          duration: curAttackDur,
          startTime: state.attackTime
        } : null,
        _seed: state.seed
      };

      ctx.save();
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;

      ctx.translate(cx, cy);
      ctx.scale(state.scale, state.scale);

      try {
        // Draw Monster
        drawMonster(ctx, 0, 0, ent);
        if (ent._lastArrowFiredCycle) {
          state._lastArrowFiredCycle = ent._lastArrowFiredCycle;
        }

        // Draw HP Bar
        if (showHp) {
          const autoOffset = getMobUiOffsets(ent).hpOffset;
          const finalOffset = state.customHpOffset > 0 ? state.customHpOffset : autoOffset;
          drawEntityHP(ctx, ent, 0, 0, finalOffset);
        }

        // Update and draw procedural arrows
        const halfW = canvas.width / (2 * state.scale);
        const halfH = canvas.height / (2 * state.scale);
        const bounds = { minX: -halfW + 12, maxX: halfW - 12, minY: -halfH + 12, maxY: halfH - 12 };

        updateGoblinArrows(dt, bounds, null);
        drawGoblinArrows(ctx);

        // Update and draw particles
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.life += dt;
          if (p.life >= p.maxLife) {
            particles.splice(i, 1);
            continue;
          }
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.vy += p.gravity * dt;
          p.vx *= Math.pow(p.drag, dt * 60);
          p.vy *= Math.pow(p.drag, dt * 60);

          const progress = p.life / p.maxLife;
          const alpha = Math.max(0, 1 - progress);
          const currentSize = p.shrink ? p.size * (1 - progress) : p.size;

          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.fillStyle = p.color;
          if (p.style === "wolf_leg" || p.style === "wolf_tail" || p.style === "wolf_head") {
            ctx.beginPath();
            ctx.ellipse(p.x, p.y, currentSize, currentSize * 0.6, p.life * 5, 0, Math.PI * 2);
            ctx.fill();
            if (p.accentColor) {
              ctx.fillStyle = p.accentColor;
              ctx.beginPath();
              ctx.ellipse(p.x, p.y, currentSize * 0.5, currentSize * 0.3, p.life * 5, 0, Math.PI * 2);
              ctx.fill();
            }
          } else if (p.style === "glass_shard") {
            // Faceted diamond glass shard
            ctx.beginPath();
            ctx.moveTo(p.x, p.y - currentSize);
            ctx.lineTo(p.x + currentSize * 0.55, p.y);
            ctx.lineTo(p.x, p.y + currentSize * 1.1);
            ctx.lineTo(p.x - currentSize * 0.55, p.y);
            ctx.closePath();
            ctx.fill();

            // Glass specular edge highlight
            ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.95})`;
            ctx.beginPath();
            ctx.moveTo(p.x, p.y - currentSize);
            ctx.lineTo(p.x + currentSize * 0.55, p.y);
            ctx.lineTo(p.x, p.y);
            ctx.closePath();
            ctx.fill();
          } else {
            ctx.beginPath();
            ctx.arc(p.x, p.y, Math.max(0.5, currentSize), 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }
      } catch (err) {
        console.error("Renderer error:", err);
      }

      ctx.restore();

      requestAnimationFrame(renderLoop);
    }

    requestAnimationFrame(renderLoop);
  </script>
</body>
</html>
